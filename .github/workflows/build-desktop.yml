name: Build Desktop Apps

on:
  push:
    branches: [ master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: addressbook-windows
            separator: ";"
          - os: ubuntu-24.04
            artifact_name: addressbook-linux
            separator: ":"
          - os: macos-latest
            artifact_name: addressbook-macos
            separator: ":"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Ensure assets folder exists
        shell: bash
        run: mkdir -p assets

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libgl1 libgles2 libegl1 \
            libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libmtdev1 libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0 \
            libsmpeg0 libswscale-dev libavformat-dev libavcodec-dev \
            xclip xsel fonts-dejavu

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config sdl2 sdl2_image sdl2_mixer sdl2_ttf

      - name: Install common Python dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r addressbook_app/requirements.txt
          python -m pip install pyinstaller==6.10.0

      - name: Verify Kivy imports before building (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          KIVY_GL_BACKEND: mock
        run: |
          python -c "import kivy; import requests; print('Kivy OK:', kivy.__version__)"

      - name: Build executable (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          KIVY_GL_BACKEND: mock
        run: |
          set -o pipefail
          cd addressbook_app
          pyinstaller --name AddressBook --onefile --windowed --clean --noconfirm \
            --add-data "../assets${{ matrix.separator }}assets" main.py 2>&1 | tee pyinstaller_full.log

      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -r addressbook_app/requirements.txt
          pip install pyinstaller

      - name: Install Windows Kivy dependencies
        if: runner.os == 'Windows'
        run: |
          pip install kivy_deps.sdl2 kivy_deps.glew

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        env:
          KIVY_GL_BACKEND: mock
        run: |
          cd addressbook_app
          pyinstaller --name AddressBook --onefile --windowed --add-data "../assets${{ matrix.separator }}assets" main.py

      - name: Upload artifact (Linux/macOS, strict)
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: addressbook_app/dist/*
          if-no-files-found: error

      - name: Upload artifact (Windows, lenient)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: addressbook_app/dist/*

      - name: Upload PyInstaller full log (Linux/macOS only)
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-log-${{ matrix.artifact_name }}
          path: addressbook_app/pyinstaller_full.log
          if-no-files-found: ignore
